
trigger:
  branches:
    include:
      - main

pr: none

parameters:
  - name: resourceGroup
    displayName: Azure Resource Group
    type: string
    default: 'rg-avd'

  - name: location
    displayName: Azure Region
    type: string
    default: 'southeastasia'

  - name: vmCount
    displayName: Number of AVD Session Hosts
    type: number
    default: 2

  - name: vmSize
    displayName: AVD VM Size
    type: string
    default: 'Standard_D4s_v5'

  - name: deploymentAction
    displayName: Terraform Action
    type: string
    default: plan
    values:
      - plan
      - apply

variables:
  terraformVersion: '1.9.8'
  terraformWorkingDirectory: '$(Build.SourcesDirectory)'

  # Update these values
  azureServiceConnection: 'YOUR-AZURE-SERVICE-CONNECTION'
  tfStateResourceGroup: 'rg-terraform-state'
  tfStateStorageAccount: 'YOURSTORAGEACCOUNT'
  tfStateContainer: 'tfstate'
  tfStateKey: 'avd/terraform.tfstate'

pool:
  vmImage: ubuntu-latest

stages:

# ==================================================
# STAGE 1: VALIDATE
# ==================================================

- stage: Validate
  displayName: Terraform Validate

  jobs:
    - job: TerraformValidate
      displayName: Validate Terraform Configuration

      steps:
        - checkout: self

        - task: Bash@3
          displayName: Install Terraform
          inputs:
            targetType: inline
            script: |
              set -euo pipefail

              TF_VERSION="$(terraformVersion)"

              wget -q \
                "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"

              unzip -o "terraform_${TF_VERSION}_linux_amd64.zip"

              sudo install terraform /usr/local/bin/terraform

              terraform version

        - task: Bash@3
          displayName: Verify Terraform Files
          inputs:
            targetType: inline
            workingDirectory: '$(terraformWorkingDirectory)'
            script: |
              set -euo pipefail

              echo "Terraform working directory:"
              pwd

              echo "Terraform files:"
              ls -la

              test -f main.tf
              test -f variables.tf
              test -f providers.tf
              test -f backend.tf

              echo "Terraform configuration verified."

        - task: AzureCLI@2
          displayName: Terraform Format and Validate
          inputs:
            azureSubscription: '$(azureServiceConnection)'
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -euo pipefail

              cd "$(terraformWorkingDirectory)"

              export ARM_USE_CLI=true
              export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"

              terraform fmt -check -diff -recursive

              terraform init -input=false \
                -backend-config="resource_group_name=$(tfStateResourceGroup)" \
                -backend-config="storage_account_name=$(tfStateStorageAccount)" \
                -backend-config="container_name=$(tfStateContainer)" \
                -backend-config="key=$(tfStateKey)" \
                -backend-config="use_azuread_auth=true"

              terraform validate

# ==================================================
# STAGE 2: PLAN
# ==================================================

- stage: Plan
  displayName: Terraform Plan
  dependsOn: Validate

  jobs:
    - job: TerraformPlan
      displayName: Generate Terraform Plan

      steps:
        - checkout: self

        - task: Bash@3
          displayName: Install Terraform
          inputs:
            targetType: inline
            script: |
              set -euo pipefail

              TF_VERSION="$(terraformVersion)"

              wget -q \
                "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"

              unzip -o "terraform_${TF_VERSION}_linux_amd64.zip"

              sudo install terraform /usr/local/bin/terraform

              terraform version

        - task: AzureCLI@2
          displayName: Create Terraform Plan
          inputs:
            azureSubscription: '$(azureServiceConnection)'
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -euo pipefail

              cd "$(terraformWorkingDirectory)"

              export ARM_USE_CLI=true
              export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"

              SUBSCRIPTION_ID="$ARM_SUBSCRIPTION_ID"

              mkdir -p "$(Build.ArtifactStagingDirectory)"

              terraform init -input=false \
                -backend-config="resource_group_name=$(tfStateResourceGroup)" \
                -backend-config="storage_account_name=$(tfStateStorageAccount)" \
                -backend-config="container_name=$(tfStateContainer)" \
                -backend-config="key=$(tfStateKey)" \
                -backend-config="use_azuread_auth=true"

              terraform validate

              terraform plan \
                -input=false \
                -lock-timeout=5m \
                -var="resource_group_name=${{ parameters.resourceGroup }}" \
                -var="location=${{ parameters.location }}" \
                -var="subscription_id=${SUBSCRIPTION_ID}" \
                -var="session_host_count=${{ parameters.vmCount }}" \
                -var="vm_size_1=${{ parameters.vmSize }}" \
                -out="$(Build.ArtifactStagingDirectory)/tfplan"

        - publish: '$(Build.ArtifactStagingDirectory)/tfplan'
          artifact: terraform-plan
          displayName: Publish Terraform Plan

# ==================================================
# STAGE 3: APPROVAL
# ==================================================

- stage: Approval
  displayName: Manual Approval
  dependsOn: Plan

  condition: and(
    succeeded(),
    eq('${{ parameters.deploymentAction }}', 'apply')
    )

  jobs:
    - job: ManualApproval
      displayName: Approve Terraform Deployment
      pool: server
      timeoutInMinutes: 1440

      steps:
        - task: ManualValidation@1
          timeoutInMinutes: 1440
          inputs:
            notifyUsers: ''
            instructions: |
              Review the Terraform plan artifact.
              Approve to proceed with AVD infrastructure deployment.
            onTimeout: reject

# ==================================================
# STAGE 4: APPLY
# ==================================================

- stage: Apply
  displayName: Terraform Apply

  dependsOn:
    - Plan
    - Approval

  condition: and(
    succeeded(),
    eq('${{ parameters.deploymentAction }}', 'apply')
    )

  jobs:
    - job: TerraformApply
      displayName: Deploy AVD Infrastructure

      steps:
        - checkout: self

        - download: current
          artifact: terraform-plan

        - task: Bash@3
          displayName: Install Terraform
          inputs:
            targetType: inline
            script: |
              set -euo pipefail

              TF_VERSION="$(terraformVersion)"

              wget -q \
                "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"

              unzip -o "terraform_${TF_VERSION}_linux_amd64.zip"

              sudo install terraform /usr/local/bin/terraform

              terraform version

        - task: AzureCLI@2
          displayName: Apply Terraform Plan
          inputs:
            azureSubscription: '$(azureServiceConnection)'
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -euo pipefail

              cd "$(terraformWorkingDirectory)"

              export ARM_USE_CLI=true
              export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"

              terraform init -input=false \
                -backend-config="resource_group_name=$(tfStateResourceGroup)" \
                -backend-config="storage_account_name=$(tfStateStorageAccount)" \
                -backend-config="container_name=$(tfStateContainer)" \
                -backend-config="key=$(tfStateKey)" \
                -backend-config="use_azuread_auth=true"

              test -f "$(Pipeline.Workspace)/terraform-plan/tfplan"

              terraform apply \
                -input=false \
                -auto-approve \
                "$(Pipeline.Workspace)/terraform-plan/tfplan"
