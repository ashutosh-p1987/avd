
trigger: none
pr: none

parameters:
  - name: resourceGroup
    displayName: Resource Group
    type: string
    default: rg-avd

  - name: location
    displayName: Azure Region
    type: string
    default: southeastasia

  - name: vmCount
    displayName: VM Count
    type: number
    default: 2

  - name: vmSize
    displayName: VM Size
    type: string
    default: Standard_D4s_v5

  - name: deploymentAction
    displayName: Deployment Action
    type: string
    default: plan
    values:
      - plan
      - apply

variables:
  terraformVersion: '1.9.8'
  terraformWorkingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
  azureServiceConnection: 'scret'
  artifactName: 'terraform-plan'

stages:

# ==========================================
# STAGE 1 - TERRAFORM VALIDATION
# ==========================================

- stage: Validate
  displayName: Terraform Init and Validate

  jobs:
  - job: TerraformValidate
    displayName: Validate Terraform

    pool:
      vmImage: ubuntu-latest

    steps:
    - checkout: self

    - bash: |
        set -euo pipefail

        TF_VERSION="$(terraformVersion)"

        echo "Installing Terraform $TF_VERSION"

        curl -fsSLo /tmp/terraform.zip \
          "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"

        unzip -o /tmp/terraform.zip -d /tmp/terraform

        sudo install /tmp/terraform/terraform /usr/local/bin/terraform

        terraform version
      displayName: Install Terraform

    - task: AzureCLI@2
      displayName: Terraform Format, Init and Validate
      inputs:
        azureSubscription: $(azureServiceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        workingDirectory: $(terraformWorkingDirectory)
        inlineScript: |
          set -euo pipefail

          echo "Terraform Formatting"

          terraform fmt -check -diff -recursive

          echo "Terraform Init"

          terraform init -input=false

          echo "Terraform Validate"

          terraform validate

          echo "Validation completed successfully"

      env:
        ARM_USE_CLI: 'true'
        TF_IN_AUTOMATION: 'true'

# ==========================================
# STAGE 2 - TERRAFORM PLAN
# ==========================================

- stage: Plan
  displayName: Terraform Plan

  dependsOn: Validate
  condition: succeeded()

  jobs:
  - job: TerraformPlan
    displayName: Generate Terraform Plan

    pool:
      vmImage: ubuntu-latest

    steps:
    - checkout: self

    - bash: |
        set -euo pipefail

        TF_VERSION="$(terraformVersion)"

        curl -fsSLo /tmp/terraform.zip \
          "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"

        unzip -o /tmp/terraform.zip -d /tmp/terraform

        sudo install /tmp/terraform/terraform /usr/local/bin/terraform

        terraform version
      displayName: Install Terraform

    - task: AzureCLI@2
      displayName: Terraform Init and Plan
      inputs:
        azureSubscription: $(azureServiceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        workingDirectory: $(terraformWorkingDirectory)
        inlineScript: |
          set -euo pipefail

          terraform init -input=false

          terraform validate

          mkdir -p "$(Build.ArtifactStagingDirectory)/terraform-plan"

          echo "Creating Terraform Plan"

          terraform plan \
            -input=false \
            -lock-timeout=5m \
            -out="$(Build.ArtifactStagingDirectory)/terraform-plan/tfplan"

          terraform show -no-color \
            "$(Build.ArtifactStagingDirectory)/terraform-plan/tfplan" \
            > "$(Build.ArtifactStagingDirectory)/terraform-plan/plan.txt"

          echo "Terraform Plan completed"

      env:
        ARM_USE_CLI: 'true'
        TF_IN_AUTOMATION: 'true'
        TF_VAR_resource_group_name: '${{ parameters.resourceGroup }}'
        TF_VAR_location: '${{ parameters.location }}'
        TF_VAR_vm_count: '${{ parameters.vmCount }}'
        TF_VAR_vm_size: '${{ parameters.vmSize }}'

    - task: PublishPipelineArtifact@1
      displayName: Publish Terraform Plan
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/terraform-plan'
        artifact: $(artifactName)
        publishLocation: pipeline

# ==========================================
# STAGE 3 - MANUAL APPROVAL
# ==========================================

- stage: Approval
  displayName: Terraform Deployment Approval

  dependsOn: Plan

  condition: |
    and(
      succeeded(),
      eq('${{ parameters.deploymentAction }}', 'apply')
    )

  jobs:
  - job: ManualApproval
    displayName: Approve Terraform Deployment

    pool: server

    timeoutInMinutes: 1440

    steps:
    - task: ManualValidation@1
      timeoutInMinutes: 1440

      inputs:
        notifyUsers: ''
        approvers: ''
        allowApproversToApproveTheirOwnRuns: true

        instructions: |
          Review the Terraform plan before approval.

          Resource Group: ${{ parameters.resourceGroup }}
          Location: ${{ parameters.location }}
          VM Count: ${{ parameters.vmCount }}
          VM Size: ${{ parameters.vmSize }}

          Approve to execute Terraform Apply.

        onTimeout: reject

# ==========================================
# STAGE 4 - TERRAFORM APPLY
# ==========================================

- stage: Apply
  displayName: Terraform Apply

  dependsOn:
    - Plan
    - Approval

  condition: |
    and(
      succeeded(),
      eq('${{ parameters.deploymentAction }}', 'apply')
    )

  jobs:
  - job: TerraformApply
    displayName: Deploy Azure Infrastructure

    pool:
      vmImage: ubuntu-latest

    steps:
    - checkout: self

    - bash: |
        set -euo pipefail

        TF_VERSION="$(terraformVersion)"

        curl -fsSLo /tmp/terraform.zip \
          "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"

        unzip -o /tmp/terraform.zip -d /tmp/terraform

        sudo install /tmp/terraform/terraform /usr/local/bin/terraform

        terraform version
      displayName: Install Terraform

    - task: DownloadPipelineArtifact@2
      displayName: Download Terraform Plan
      inputs:
        buildType: current
        artifactName: $(artifactName)
        targetPath: $(Pipeline.Workspace)/terraform-plan

    - task: AzureCLI@2
      displayName: Terraform Apply
      inputs:
        azureSubscription: $(azureServiceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        workingDirectory: $(terraformWorkingDirectory)
        inlineScript: |
          set -euo pipefail

          echo "Initializing Terraform"

          terraform init -input=false

          echo "Applying saved Terraform Plan"

          terraform apply \
            -input=false \
            -lock-timeout=5m \
            "$(Pipeline.Workspace)/terraform-plan/tfplan"

          echo "Terraform deployment completed successfully"

      env:
        ARM_USE_CLI: 'true'
        TF_IN_AUTOMATION: 'true'
