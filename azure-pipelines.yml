
trigger:
  branches:
    include:
      - main

pr: none

parameters:
  - name: resourceGroup
    displayName: Azure Resource Group
    type: string
    default: 'rg-avd'

  - name: location
    displayName: Azure Region
    type: string
    default: 'southeastasia'

  - name: vmCount
    displayName: Number of AVD VMs
    type: number
    default: 5

  - name: vmSize
    displayName: Azure VM Size
    type: string
    default: 'Standard_D4s_v5'

  - name: deploymentAction
    displayName: Terraform Action
    type: string
    default: plan
    values:
      - plan
      - apply

variables:
  terraformVersion: '1.9.8'
  terraformWorkingDirectory: '$(Build.SourcesDirectory)'
  azureServiceConnection: 'scret'

  # Remote Terraform state configuration
  tfStateResourceGroup: 'avdrg'
  tfStateStorageAccount: 'terrafotmstate'
  tfStateContainer: 'tfstate'
  tfStateKey: 'avd/terraform.tfstate'

pool:
  vmImage: ubuntu-latest

stages:

# ------------------------------------------------
# STAGE 1 - VALIDATE
# ------------------------------------------------
- stage: Validate
  displayName: Terraform Validate

  jobs:
    - job: TerraformValidate
      steps:
        - checkout: self

        - task: Bash@3
          displayName: Install Terraform
          inputs:
            targetType: inline
            script: |
              set -e
              TF_VERSION="$(terraformVersion)"
              wget -q https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip
              unzip -o terraform_${TF_VERSION}_linux_amd64.zip
              sudo install terraform /usr/local/bin/terraform
              terraform version

        - task: Bash@3
          displayName: Verify Terraform Files
          inputs:
            targetType: inline
            workingDirectory: '$(terraformWorkingDirectory)'
            script: |
              set -e
              echo "Terraform directory: $(terraformWorkingDirectory)"
              ls -la
              test -f main.tf
              test -f variables.tf
              test -f providers.tf

        - task: AzureCLI@2
          displayName: Terraform Format and Validate
          inputs:
            azureSubscription: '$(azureServiceConnection)'
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -e
              cd "$(terraformWorkingDirectory)"

              export ARM_USE_CLI=true
              export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)

              terraform fmt -check -diff -recursive

              terraform init -input=false \
                -backend-config="resource_group_name=$(tfStateResourceGroup)" \
                -backend-config="storage_account_name=$(tfStateStorageAccount)" \
                -backend-config="container_name=$(tfStateContainer)" \
                -backend-config="key=$(tfStateKey)" \
                -backend-config="use_azuread_auth=true"

              terraform validate

# ------------------------------------------------
# STAGE 2 - PLAN
# ------------------------------------------------
- stage: Plan
  displayName: Terraform Plan
  dependsOn: Validate

  jobs:
    - job: TerraformPlan
      steps:
        - checkout: self

        - task: Bash@3
          displayName: Install Terraform
          inputs:
            targetType: inline
            script: |
              set -e
              TF_VERSION="$(terraformVersion)"
              wget -q https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip
              unzip -o terraform_${TF_VERSION}_linux_amd64.zip
              sudo install terraform /usr/local/bin/terraform
              terraform version

        - task: AzureCLI@2
          displayName: Create Terraform Plan
          inputs:
            azureSubscription: '$(azureServiceConnection)'
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -e
              cd "$(terraformWorkingDirectory)"

              export ARM_USE_CLI=true
              export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)

              terraform init -input=false \
                -backend-config="resource_group_name=$(tfStateResourceGroup)" \
                -backend-config="storage_account_name=$(tfStateStorageAccount)" \
                -backend-config="container_name=$(tfStateContainer)" \
                -backend-config="key=$(tfStateKey)" \
                -backend-config="use_azuread_auth=true"

              terraform plan \
                -input=false \
                -lock-timeout=5m \
                -var="resourceGroup=${{ parameters.resourceGroup }}" \
                -var="location=${{ parameters.location }}" \
                -var="vmCount=${{ parameters.vmCount }}" \
                -var="vmSize=${{ parameters.vmSize }}" \
                -out="$(Build.ArtifactStagingDirectory)/tfplan"

        - publish: '$(Build.ArtifactStagingDirectory)/tfplan'
          artifact: terraform-plan
          displayName: Publish Terraform Plan

# ------------------------------------------------
# STAGE 3 - MANUAL APPROVAL
# ------------------------------------------------
- stage: Approval
  displayName: Apply Approval
  dependsOn: Plan
  condition: and(succeeded(), eq('${{ parameters.deploymentAction }}', 'apply'))

  jobs:
    - job: ManualApproval
      displayName: Approve Terraform Apply
      pool: server
      timeoutInMinutes: 1440

      steps:
        - task: ManualValidation@1
          timeoutInMinutes: 1440
          inputs:
            notifyUsers: ''
            instructions: |
              Review the Terraform plan artifact.
              Approve to continue with infrastructure deployment.
            onTimeout: reject

# ------------------------------------------------
# STAGE 4 - APPLY
# ------------------------------------------------
- stage: Apply
  displayName: Terraform Apply
  dependsOn:
    - Plan
    - Approval

  condition: and(
    succeeded(),
    eq('${{ parameters.deploymentAction }}', 'apply')
    )

  jobs:
    - job: TerraformApply
      displayName: Apply Infrastructure

      steps:
        - checkout: self

        - download: current
          artifact: terraform-plan

        - task: Bash@3
          displayName: Install Terraform
          inputs:
            targetType: inline
            script: |
              set -e
              TF_VERSION="$(terraformVersion)"
              wget -q https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip
              unzip -o terraform_${TF_VERSION}_linux_amd64.zip
              sudo install terraform /usr/local/bin/terraform
              terraform version

        - task: AzureCLI@2
          displayName: Apply Terraform Plan
          inputs:
            azureSubscription: '$(azureServiceConnection)'
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -e
              cd "$(terraformWorkingDirectory)"

              export ARM_USE_CLI=true
              export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)

              terraform init -input=false \
                -backend-config="resource_group_name=$(tfStateResourceGroup)" \
                -backend-config="storage_account_name=$(tfStateStorageAccount)" \
                -backend-config="container_name=$(tfStateContainer)" \
                -backend-config="key=$(tfStateKey)" \
                -backend-config="use_azuread_auth=true"

              terraform apply \
                -input=false \
                -auto-approve \
                "$(Pipeline.Workspace)/terraform-plan/tfplan"
