# ==========================================
# Azure DevOps - Terraform CI/CD Pipeline
# ==========================================
 
trigger:
  branches:
    include:
      - main
 
pool:
  vmImage: ubuntu-latest
 
variables:
  azureServiceConnection: 'test123'
  terraformVersion: '1.9.8'
  terraformDirectory: '$(Build.SourcesDirectory)'
 
stages:
 
# ==========================================
# STAGE 1 - TERRAFORM PLAN
# ==========================================
 
- stage: TerraformPlan
  displayName: 'Terraform Plan'
 
  jobs:
  - job: Plan
    displayName: 'Validate and Plan'
 
    steps:
 
    - checkout: self
 
    # Install Terraform CLI
    - bash: |
        set -euo pipefail
 
        sudo apt-get update
        sudo apt-get install -y unzip curl
 
        curl -fsSLo terraform.zip \
          https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip
 
        unzip -o terraform.zip
        sudo install terraform /usr/local/bin/terraform
 
        terraform version
      displayName: 'Install Terraform'
 
    # Azure Authentication and Terraform Plan
    - task: AzureCLI@2
      displayName: 'Terraform Init Validate Plan'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: bash
        scriptLocation: inlineScript
        workingDirectory: '$(terraformDirectory)'
        inlineScript: |
          set -euo pipefail
 
          echo "Checking Azure login"
          az account show
 
          echo "Terraform initialization"
          terraform init -input=false
 
          echo "Terraform formatting"
          terraform fmt -check -recursive
 
          echo "Terraform validation"
          terraform validate
 
          echo "Terraform plan"
          terraform plan \
            -input=false \
            -out=tfplan
 
          terraform show -no-color tfplan > plan.txt
 
    # Publish Terraform Plan
    - publish: '$(terraformDirectory)/tfplan'
      artifact: terraform-plan
      displayName: 'Publish Terraform Plan'
 
    - publish: '$(terraformDirectory)/plan.txt'
      artifact: terraform-report
      displayName: 'Publish Terraform Report'
 
 
# ==========================================
# STAGE 2 - TERRAFORM APPLY
# ==========================================
 
- stage: TerraformApply
  displayName: 'Terraform Apply'
  dependsOn: TerraformPlan
  condition: succeeded()
 
  jobs:
  - job: DeployAzure
    displayName: 'Deploy Azure Infrastructure'
 
    steps:
 
    - checkout: self
 
    # Install Terraform CLI
    - bash: |
        set -euo pipefail
 
        sudo apt-get update
        sudo apt-get install -y unzip curl
 
        curl -fsSLo terraform.zip \
          https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip
 
        unzip -o terraform.zip
        sudo install terraform /usr/local/bin/terraform
 
        terraform version
      displayName: 'Install Terraform'
 
    # Download Terraform Plan
    - download: current
      artifact: terraform-plan
      displayName: 'Download Terraform Plan'
 
    # Azure Authentication and Apply
    - task: AzureCLI@2
      displayName: 'Terraform Apply'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: bash
        scriptLocation: inlineScript
        workingDirectory: '$(terraformDirectory)'
        inlineScript: |
          set -euo pipefail
 
          echo "Checking Azure subscription"
          az account show
 
          echo "Terraform initialization"
          terraform init -input=false -var="subscription_id='7624824a-7f57-4902-9b9f-9150b5aa9a9d'" 
          terraform plan -input=false -var="subscription_id='7624824a-7f57-4902-9b9f-9150b5aa9a9d'"
 
          echo "Applying Terraform plan"
          terraform apply \
            -var="subscription_id='7624824a-7f57-4902-9b9f-9150b5aa9a9d'" \
            -input=false \
            "$(Pipeline.Workspace)/terraform-plan/tfplan"
 
          echo "Deployment outputs"
          terraform output
 
          echo "Terraform deployment completed"